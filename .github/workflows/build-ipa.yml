name: Build BurgerAdam IPA

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Native iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Archive
        run: |
          xcodebuild clean archive \
            -project BurgerAdam.xcodeproj \
            -scheme BurgerAdam \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/BurgerAdam.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload and Create IPA
        run: |
          mkdir -p Payload
          cp -R build/BurgerAdam.xcarchive/Products/Applications/BurgerAdam.app Payload/
          zip -r9 BurgerAdam.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BurgerAdam-iOS-IPA
          path: BurgerAdam.ipa
          retention-days: 30
